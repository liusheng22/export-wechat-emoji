name: release

# 仅通过 tag 触发构建和发布
on:
  push:
    tags:
      - 'v*' # 监听所有以 v 开头的 tag（如 v0.1.2）

# 同一 tag 重推（强推重发版）时取消旧的运行，避免并发写同一个 release；
# 资产更新靠各上传步骤的 gh release upload --clobber 同名替换完成，
# 不删除 release 本身，构建失败时已有资产仍可下载。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            app_arch: arm64
            tauri_arch: aarch64
            tauri_target: aarch64-apple-darwin
            build_cli: true
          - runner: macos-latest
            app_arch: x64
            tauri_arch: x64
            tauri_target: x86_64-apple-darwin
            build_cli: false

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史，包括 tag 信息

      # pnpm 版本会自动从 package.json 的 packageManager 字段读取
      - name: setup pnpm
        uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: build key dumper dylib (for app auto-dump)
        run: bash tools/wechat-key-dumper/build.sh

      - name: build helper binaries (for tauri bundler)
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.tauri_target }} --bins --features dev-tools

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile
        id: install_frontend_dependencies
      - name: Clear pnpm cache on failure
        if: steps.install_frontend_dependencies.outcome == 'failure'
        run: |
          pnpm store prune
          pnpm install --no-frozen-lockfile

      # tauri-action 只负责构建（不传 tagName 等发布参数，它不会创建/更新
      # release，也就不会上传默认命名资产——那正是重发布时 already_exists
      # 422 的来源）。release 的创建/更新统一用 gh，资产一律 --clobber 按名替换。
      - name: ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cat > /tmp/release-notes.md <<'NOTES'
          本版本同时发布 App 与 CLI：

          - macOS App（Apple Silicon）：wxemoticon-app-macos-arm64.dmg
          - macOS App（Intel）：wxemoticon-app-macos-x64.dmg
          - CLI：wxemoticon（aarch64 / x86_64）
          - Windows CLI：wxemoticon-x86_64-windows.zip
          - 安装脚本：install-wxemoticon.sh / install-wxemoticon.cmd

          CLI 安装（macOS / Linux）：
          curl -fsSL https://raw.githubusercontent.com/liusheng22/export-wechat-emoji/main/scripts/install-wxemoticon.sh | bash

          CLI 安装（Windows，cmd）：
          curl -fsSL https://raw.githubusercontent.com/liusheng22/export-wechat-emoji/main/scripts/install-wxemoticon.cmd -o "%TEMP%\install-wxemoticon.cmd" && "%TEMP%\install-wxemoticon.cmd"

          CLI 常用命令：
          - wxemoticon key
          - wxemoticon urls
          - wxemoticon export
          - wxemoticon update

          Homebrew（可选，仅 macOS）：
          - brew tap liusheng22/wxemoticon
          - brew install wxemoticon
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "导出微信表情包 + wxemoticon ${TAG#v}" \
              --notes-file /tmp/release-notes.md
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }} # 密钥，需要提前配置在 Github Secrets中
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }} # 生成时填入的密码，没有则不填

        with:
          args: --target ${{ matrix.tauri_target }}

      - name: add macOS repair helper to DMG
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.tauri_target }}/release/bundle"
          DMG_PATH="$(find "${BUNDLE_DIR}/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          if [[ -z "${DMG_PATH}" ]]; then
            echo "Tauri DMG not found in ${BUNDLE_DIR}/dmg" >&2
            exit 1
          fi

          bash packaging/macos/add-fix-script-to-dmg.sh "${DMG_PATH}"

      - name: upload app assets with clear names (${{ matrix.app_arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BUNDLE_DIR="src-tauri/target/${{ matrix.tauri_target }}/release/bundle"

          DMG_SRC="$(ls -1 "${BUNDLE_DIR}"/dmg/*.dmg | head -n 1)"
          APP_SRC="$(ls -1 "${BUNDLE_DIR}"/macos/*.app.tar.gz | head -n 1)"

          DMG_DST="wxemoticon-app-macos-${{ matrix.app_arch }}.dmg"
          APP_DST="wxemoticon-app-macos-${{ matrix.app_arch }}.app.tar.gz"

          cp "$DMG_SRC" "$DMG_DST"
          cp "$APP_SRC" "$APP_DST"

          gh release upload "$TAG" "$DMG_DST" "$APP_DST" --clobber

      - name: build wxemoticon cli (arm64 + x86_64)
        if: matrix.build_cli
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin
          cargo build --manifest-path cli/Cargo.toml --release
          cargo build --manifest-path cli/Cargo.toml --release --target x86_64-apple-darwin
          tar -czf wxemoticon-aarch64-apple-darwin.tar.gz -C cli/target/release wxemoticon
          tar -czf wxemoticon-x86_64-apple-darwin.tar.gz -C cli/target/x86_64-apple-darwin/release wxemoticon
          shasum -a 256 wxemoticon-*.tar.gz > wxemoticon-SHA256SUMS-macos.txt

      - name: upload wxemoticon cli assets
        if: matrix.build_cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            wxemoticon-aarch64-apple-darwin.tar.gz \
            wxemoticon-x86_64-apple-darwin.tar.gz \
            wxemoticon-SHA256SUMS-macos.txt \
            scripts/install-wxemoticon.sh \
            --clobber

      - name: publish Homebrew formula to tap repo
        if: matrix.build_cli
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" || -z "${HOMEBREW_TAP_REPO:-}" ]]; then
            echo "Homebrew tap secrets are not configured, skip publishing formula."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          ARM_SHA="$(awk '/wxemoticon-aarch64-apple-darwin.tar.gz/{print $1}' wxemoticon-SHA256SUMS-macos.txt)"
          X64_SHA="$(awk '/wxemoticon-x86_64-apple-darwin.tar.gz/{print $1}' wxemoticon-SHA256SUMS-macos.txt)"

          if [[ -z "${ARM_SHA}" || -z "${X64_SHA}" ]]; then
            echo "failed to parse CLI checksums from wxemoticon-SHA256SUMS-macos.txt" >&2
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}" >/dev/null 2>&1 || true' EXIT

          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" "${TMP_DIR}/tap"
          mkdir -p "${TMP_DIR}/tap/Formula"
          bash scripts/generate-homebrew-formula.sh "${TAG}" "${ARM_SHA}" "${X64_SHA}" "${REPO}" > "${TMP_DIR}/tap/Formula/wxemoticon.rb"

          cd "${TMP_DIR}/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain -- Formula/wxemoticon.rb)" ]]; then
            echo "Homebrew formula unchanged, skip push."
            exit 0
          fi

          git add Formula/wxemoticon.rb
          git commit -m "wxemoticon ${TAG}"
          git push origin HEAD

  publish-cli-windows:
    needs: publish-tauri
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的 git 历史，包括 tag 信息

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 静态链接 CRT：产物不依赖 VC++ 运行库
      - name: build wxemoticon cli (static crt)
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --manifest-path cli/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: package cli assets
        shell: pwsh
        run: |
          Compress-Archive -Path cli/target/x86_64-pc-windows-msvc/release/wxemoticon.exe -DestinationPath wxemoticon-x86_64-windows.zip -Force
          $hash = (Get-FileHash wxemoticon-x86_64-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  wxemoticon-x86_64-windows.zip" | Out-File -Encoding ascii wxemoticon-SHA256SUMS-windows.txt

      - name: upload wxemoticon windows cli assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            wxemoticon-x86_64-windows.zip \
            wxemoticon-SHA256SUMS-windows.txt \
            scripts/install-wxemoticon.cmd \
            --clobber
